name: NMDC Stock Analyzer

on:
  schedule:
    # Every 5 minutes, 3:45 AM – 10:05 AM UTC  =  9:15 AM – 3:35 PM IST
    # GitHub Actions cron is UTC.  IST = UTC + 5:30
    # 9:15 IST → 03:45 UTC  |  15:30 IST → 10:00 UTC
    - cron: "45,50,55 3 * * 1-5"       # 9:15–9:55 IST
    - cron: "0,5,10,15,20,25,30,35,40,45,50,55 4 * * 1-5"  # 9:30–10:25 IST
    - cron: "0,5,10,15,20,25,30,35,40,45,50,55 5 * * 1-5"  # 10:30–11:25 IST
    - cron: "0,5,10,15,20,25,30,35,40,45,50,55 6 * * 1-5"  # 11:30–12:25 IST
    - cron: "0,5,10,15,20,25,30,35,40,45,50,55 7 * * 1-5"  # 12:30–13:25 IST
    - cron: "0,5,10,15,20,25,30,35,40,45,50,55 8 * * 1-5"  # 13:30–14:25 IST
    - cron: "0,5,10,15,20,25,30,35,40,45,50,55 9 * * 1-5"  # 14:30–15:25 IST
    - cron: "0,5 10 * * 1-5"                                # 15:30–15:35 IST (closing)

  workflow_dispatch:   # manual trigger from GitHub UI for testing

permissions:
  contents: write      # needed to commit CSV back to repo

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Python ────────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # ── 3. Install dependencies ───────────────────────────────────────────
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── 4. Create results directory ───────────────────────────────────────
      - name: Ensure results directory exists
        run: mkdir -p results

      # ── 5. Run analyzer ───────────────────────────────────────────────────
      - name: Run NMDC Analyzer
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python stock_analyzer.py
        # If script exits with non-zero, the step fails — GitHub will report it.
        # The retry logic is inside the Python script itself.

      # ── 6. Commit CSV back to repo ────────────────────────────────────────
      - name: Commit updated CSV to repository
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Pull latest to avoid push conflicts
          git pull --rebase origin main || true

          git add results/nmdc_signals.csv
          # Only commit if the file actually changed
          if git diff --cached --quiet; then
            echo "No CSV changes to commit."
          else
            TIMESTAMP=$(TZ='Asia/Kolkata' date '+%Y-%m-%d %H:%M IST')
            git commit -m "📊 NMDC signal update — ${TIMESTAMP}"
            git push origin main
          fi

      # ── 7. Upload CSV as artifact (30-day retention) ──────────────────────
      - name: Upload CSV as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: nmdc-signals-${{ github.run_number }}
          path: results/nmdc_signals.csv
          retention-days: 30

      # ── 8. Notify on failure ──────────────────────────────────────────────
      - name: Notify Telegram on failure
        if: failure()
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MESSAGE="🚨 *NMDC Analyzer FAILED*%0A%0ARun: ${{ github.run_number }}%0ATime: $(TZ='Asia/Kolkata' date '+%d-%b-%Y %H:%M IST')%0A%0ACheck: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MESSAGE}" \
            -d "parse_mode=Markdown" || true
